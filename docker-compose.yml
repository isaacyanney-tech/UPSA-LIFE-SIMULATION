services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: upsa_life
      POSTGRES_USER: upsa_life
      POSTGRES_PASSWORD: local_upsa_life_password
    ports:
      - "5432:5432"
    volumes:
      - upsa_life_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upsa_life -d upsa_life"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://upsa_life:local_upsa_life_password@db:5432/upsa_life
      DATABASE_SSL: "false"
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: 0
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  upsa_life_postgres:
